name: Traukalender-Monitor

on:
  # Takt kommt extern von cron-job.org (alle 15 Min per workflow_dispatch).
  # GitHubs eigener schedule-Trigger ist entfernt (war unzuverlässig).
  workflow_dispatch: {}

permissions:
  contents: write              # state.json zurückcommitten
  pages: write                 # GitHub Pages deployen
  id-token: write              # für deploy-pages

concurrency:
  group: traukalender-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Monitor ausführen (rendert public/index.html, schreibt state.json + status.json)
        run: python monitor.py

      - name: Vorzustand sichern (nur bei echter Änderung)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "traukalender-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state update $(date -u +%FT%TZ)"
            git push
          else
            echo "Keine Verfügbarkeits-Änderung."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Push senden (jeder Lauf)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          HEADLINE=$(python3 -c "import json;print(json.load(open('status.json')).get('headline',''))")
          PRIO=$(python3 -c "import json;print(json.load(open('status.json')).get('priority','default'))")
          TAGS=$(python3 -c "import json;print(json.load(open('status.json')).get('tags','calendar'))")
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -m 20 \
              -H "Title: Traukalender" \
              -H "Priority: ${PRIO}" \
              -H "Tags: ${TAGS}" \
              -H "Click: ${PAGE_URL}" \
              --data-binary "${HEADLINE} -> Uebersicht: ${PAGE_URL}" \
              "https://ntfy.sh/${NTFY_TOPIC}"
            echo "Push gesendet (Prio ${PRIO})."
          else
            echo "NTFY_TOPIC fehlt - kein Push."
          fi
