name: Traukalender-Monitor

on:
  schedule:
    # Stündlich zur Minute :01 (GitHub-Cron läuft in UTC; die Minute ist in jeder
    # Zeitzone gleich). GitHub kann geplante Läufe um einige Minuten verzögern.
    - cron: "1 * * * *"
  workflow_dispatch: {}   # erlaubt manuelles Auslösen über den Actions-Tab

permissions:
  contents: write          # um state.json nach jedem Lauf zurückzucommitten

concurrency:
  group: traukalender-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Optional: nur pushen, wenn sich etwas geändert hat -> auf "1" setzen.
          # ONLY_ON_CHANGE: "1"
        run: python monitor.py

      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "traukalender-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state $(date -u +%FT%TZ)"
            git push
          else
            echo "Kein State-Update."
          fi
